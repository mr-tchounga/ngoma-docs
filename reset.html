<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>NGOMA — Réinitialisation / Password reset</title>
  <link rel="icon" href="assets/mark.png" />
  <style>
    html, body { margin: 0; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 36px 24px 48px; }
    .brand { margin: 0 0 28px; font-size: 13px; font-weight: 700; }
    .dot { color: #4caf50; }
    h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.3; }
    .code { margin: 0 0 28px; font-size: 48px; line-height: 1; font-weight: 700; letter-spacing: 4px; }
    .btn { display: inline-block; background: #4caf50; color: #111; text-decoration: none; font-weight: 700; font-size: 16px; padding: 16px 36px; border-radius: 999px; }
    .note { margin: 28px 0 0; color: #9e9e9e; font-size: 15px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <p class="brand">NGOMA <span class="dot">●</span></p>
    <h1 id="title">Ouverture de NGOMA… / Opening NGOMA…</h1>
    <p id="code" class="code">————</p>
    <a id="open" class="btn" href="#">Ouvrir NGOMA / Open NGOMA</a>
    <p class="note">
      Saisissez ce code dans l'application si NGOMA ne s'ouvre pas.<br>
      Enter this code in the app if NGOMA does not open.
    </p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const stay = params.get('stay') === '1';
    const android = /Android/i.test(navigator.userAgent || '');
    const appLink = 'com.shifter.ngoma://login-callback/?type=recovery&token=' + encodeURIComponent(token);
    const intentLink = 'intent://login-callback/?type=recovery&token=' + encodeURIComponent(token)
      + '#Intent;scheme=com.shifter.ngoma;package=com.shifter.ngoma;end';
    const target = android ? intentLink : appLink;

    const codeEl = document.getElementById('code');
    const openEl = document.getElementById('open');
    if (token) codeEl.textContent = token;
    openEl.href = target;

    if (token && !stay) {
      window.location.replace(target);
    }
  </script>
</body>
</html>
